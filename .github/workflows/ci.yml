name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar identidad git para las pruebas
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: Pruebas
        run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S error install.sh uninstall.sh update.sh lib/common.sh scripts/doctor.sh hooks/*.sh skills/sdd-release/scripts/*.sh skills/sdd-init/scripts/*.sh skills/sdd-init/templates/git-hooks/* tests/*.sh
